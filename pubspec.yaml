publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.4.1
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_storage: ^13.4.1
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  image_picker: ^1.2.2
  intl: ^0.20.2
  lottie: ^3.3.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
